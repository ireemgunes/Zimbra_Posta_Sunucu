services:
  zimbra:
    build:
      context: ./zimbra
      dockerfile: Dockerfile
    container_name: mailos-zimbra
    hostname: ${ZIMBRA_HOSTNAME:-mail.mailos.local}
    domainname: ${ZIMBRA_DOMAIN:-mailos.local}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - ZIMBRA_DOMAIN=${ZIMBRA_DOMAIN:-mailos.local}
      - ZIMBRA_ADMIN_PASSWORD=${ZIMBRA_ADMIN_PASSWORD:-ZimbraAdmin2024!}
      - ZIMBRA_TIMEZONE=${ZIMBRA_TIMEZONE:-Europe/Istanbul}
    ports:
      - "25:25"      # SMTP
      - "465:465"    # SMTPS
      - "587:587"    # SMTP Submission
      - "110:110"    # POP3
      - "995:995"    # POP3S
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "7071:7071"  # Zimbra Admin Console
      - "8080:8080"  # Zimbra Web Client (HTTP)
      - "8443:8443"  # Zimbra Web Client (HTTPS)
    volumes:
      - zimbra_data:/opt/zimbra
      - zimbra_logs:/var/log/zimbra
    networks:
      - mailos-net
    restart: unless-stopped

  mailos-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailos-api
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - ZIMBRA_HOST=zimbra
      - ZIMBRA_ADMIN_PORT=7071
      - ZIMBRA_ADMIN_PASSWORD=${ZIMBRA_ADMIN_PASSWORD:-ZimbraAdmin2024!}
      - ZIMBRA_DOMAIN=${ZIMBRA_DOMAIN:-mailos.local}
      - MAILOS_ADMIN_SECRET=${MAILOS_ADMIN_SECRET:-supersecretkey}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - API_PORT=${API_PORT:-8000}
    ports:
      - "8000:8000"
    depends_on:
      - zimbra
      - redis
    networks:
      - mailos-net
    restart: unless-stopped

  mailos-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailos-ui
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - mailos-api
    networks:
      - mailos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mailos-redis
    volumes:
      - redis_data:/data
    networks:
      - mailos-net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mailos-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - mailos-ui
      - mailos-api
    networks:
      - mailos-net
    restart: unless-stopped
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  zimbra_data:
  zimbra_logs:
  redis_data:

networks:
  mailos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
